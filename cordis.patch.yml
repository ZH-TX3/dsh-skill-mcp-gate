# dsh-skill-mcp-gate bundle patch
#
# 装法：
#   dsh plugin --profile web add <plugin-dir>
#   （<plugin-dir> 即本插件目录，例如 ~/.dsh/plugins/dsh-skill-mcp-gate）
#
# M1 只做 skills 的 C 模式（runtime 影子覆盖 invocation）+ /gate 命令面。
# 不改动任何现有行的组合，不修改用户的 SKILL.md。
- insert:
    - id: skill-mcp-gate
      name: dsh-skill-mcp-gate
      config:
        # 项目级配置文件所在目录；留空取进程 cwd
        projectDir: null
        debug: false
